async function fetchParticipantsFromServer() {
  try {
    const separator = API_URL.includes('?') ? '&' : '?';
    const response = await fetch(API_URL + separator + 'action=participants', {
      method: 'GET',
      cache: 'no-store'
    });
    if (!response.ok) throw new Error('Server returned HTTP ' + response.status);
    const data = await response.json();
    if (!data.success) throw new Error(data.message || 'Unable to load participants.');

    state.participants = (data.participants || []).map(p => ({
      id: String(p.ParticipantID || p.participantId || ''),
      bib: String(p.BIB ?? p.Bib ?? p.bib ?? ''),
      name: String(p.Name || p.name || ''),
      category: String(p.Category || p.category || ''),
      status: String(p.Status || p.status || 'ACTIVE').toLowerCase() === 'active' ? 'pending' : String(p.Status || p.status || 'pending').toLowerCase()
    }));

    state.serverOnline = true;
    state.lastSync = new Date();
    showToast(`Loaded ${state.participants.length} participants from server.`, 'success');
    renderPage();
  } catch (error) {
    state.serverOnline = false;
    showToast('Could not load participants from server: ' + error.message, 'error');
  }
}
async function fetchScoresFromServer() {
  try {
    const separator = API_URL.includes('?') ? '&' : '?';
    const response = await fetch(API_URL + separator + 'action=scores&judgeId=' + encodeURIComponent(state.currentJudge.id), {
      method: 'GET',
      cache: 'no-store'
    });
    if (!response.ok) throw new Error('Server returned HTTP ' + response.status);
    const data = await response.json();
    if (!data.success) throw new Error(data.message || 'Unable to load scores.');

    state.scores = data.scores || [];

    // Update current judge's participant status from real saved scores.
    state.participants.forEach(p => {
      const hasScore = state.scores.some(s => s.participantId === p.id && s.judgeId === state.currentJudge.id);
      p.status = hasScore ? 'completed' : 'pending';
    });

    state.serverOnline = true;
    state.lastSync = new Date();
    renderPage();
  } catch (error) {
    state.serverOnline = false;
    showToast('Could not load scores from server: ' + error.message, 'error');
  }
}

function icon(name, cls="h-5 w-5") {
  return `<i data-lucide="${name}" class="${cls}"></i>`;
}

function renderNav() {
  Object.entries(navItems).forEach(([section,items]) => {
    const el = document.getElementById("nav-"+section);
    if (!el) return;
    el.innerHTML = items.map(item => `
      <button onclick="navigate('${item.id}')"
        class="nav-item flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition
        ${state.currentPage===item.id ? "bg-indigo-600 text-white" : "text-slate-300 hover:bg-white/5 hover:text-white"}">
        ${icon(item.icon,"h-5 w-5")}
        <span>${item.label}</span>
      </button>
    `).join("");
  });
  lucide.createIcons();
}

function navigate(page) {
  state.currentPage = page;
  renderNav();
  renderPage();
  toggleSidebar(false);
}

function renderPage() {
  const app = document.getElementById("app");
  const pages = {
    dashboard: pageDashboard,
    participants: pageParticipants,
    events: pageEvents,
    judges: pageJudges,
    judging: pageJudging,
    scores: pageScores,
    results: pageResults,
    ranking: pageRanking,
    analytics: pageAnalytics,
    reports: pageReports,
    certificates: pageCertificates,
    settings: pageSettings
  };
  app.innerHTML = `<div class="page-transition">${(pages[state.currentPage] || pageDashboard)()}</div>`;
  lucide.createIcons();
}

}

        </div>

          <button onclick="navigate('judging')" class="flex w-full items-center gap-3 rounded-xl border border-slate-200 p-3 text-left text-sm hover:bg-slate-50">${icon("clipboard-pen-line","h-5 w-5 text-indigo-600")} Start Judging</button>

function participantTable(items) {
  return `
  <div class="overflow-x-auto">
    <table class="w-full text-left text-sm">
      <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
        <tr><th class="px-5 py-3">BIB</th><th class="px-5 py-3">Participant</th><th class="px-5 py-3">Category</th><th class="px-5 py-3">Status</th><th class="px-5 py-3">Action</th></tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        ${items.map(p=>`
        <tr class="hover:bg-slate-50/70">
          <td class="px-5 py-4 font-semibold">${p.bib}</td>
          <td class="px-5 py-4"><div class="font-medium">${p.name}</div><div class="text-xs text-slate-400">${p.id}</div></td>
          <td class="px-5 py-4 text-slate-500">${p.category}</td>
          <td class="px-5 py-4">${statusBadge(p.status)}</td>
          <td class="px-5 py-4"><button onclick="startJudging('${p.id}')" class="font-semibold text-indigo-600 hover:text-blue-700">Judge</button></td>
        </tr>`).join("")}
      </tbody>
    </table>
  </div>`;
}

function statusBadge(status) {
  const map = {
    pending:["Pending","bg-amber-50 text-amber-700"],
    completed:["Completed","bg-emerald-50 text-emerald-700"],
    submitted:["Submitted","bg-indigo-50 text-blue-700"],
    draft:["Draft","bg-slate-100 text-slate-600"]
  };
  const [label,cls]=map[status]||[status,"bg-slate-100 text-slate-600"];
  return `<span class="rounded-full px-2.5 py-1 text-xs font-semibold ${cls}">${label}</span>`;
}

    </div>
    <div id="participants-table" class="rounded-2xl border border-slate-200 bg-white shadow-sm">${participantTable(state.participants)}</div>`;
}

function filterParticipants() {
  const q=(document.getElementById("participant-search")?.value||"").toLowerCase();
  const status=document.getElementById("participant-status")?.value||"";
  const filtered=state.participants.filter(p=>(!q || p.name.toLowerCase().includes(q)||p.bib.includes(q)||p.id.toLowerCase().includes(q))&&(!status||p.status===status));
  document.getElementById("participants-table").innerHTML=participantTable(filtered);
  lucide.createIcons();
}

function loadParticipant() {
  const id=document.getElementById("judge-participant").value;
  const info=document.getElementById("participant-info");
  const form=document.getElementById("score-form");
  if(!id){info.classList.add("hidden");form.innerHTML="";updateTotal();return;}
  const p=state.participants.find(x=>x.id===id);
  const existing=state.scores.find(x=>x.participantId===id&&x.judgeId===state.currentJudge.id);
  info.classList.remove("hidden");
  info.innerHTML=`<div class="grid gap-3 sm:grid-cols-3"><div><span class="text-xs text-slate-400">BIB Number</span><div class="font-semibold">${p.bib}</div></div><div><span class="text-xs text-slate-400">Name</span><div class="font-semibold">${p.name}</div></div><div><span class="text-xs text-slate-400">Category</span><div class="font-semibold">${p.category}</div></div></div>`;
  form.innerHTML=`
    <div class="grid gap-4 sm:grid-cols-2">
      ${criteria.map(c=>`<div><label class="text-sm font-medium">${c.label} <span class="text-slate-400">(max ${c.max})</span></label><input id="score-${c.key}" class="score-input mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-lg font-semibold outline-none focus:border-indigo-500" type="number" min="0" max="${c.max}" value="${existing?existing[c.key]:""}" oninput="updateTotal()"></div>`).join("")}
    </div>
    <div class="mt-5"><label class="text-sm font-medium">Judge's Comments</label><textarea id="judge-comments" rows="4" placeholder="Enter your comments about the performance..." class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-indigo-500">${existing?.comments||""}</textarea></div>
    <div class="mt-5 flex flex-col gap-3 sm:flex-row"><button onclick="saveScore()" class="flex-1 rounded-xl bg-indigo-600 px-4 py-3 font-semibold text-white hover:bg-indigo-700">${icon("save","inline-block mr-2 h-5 w-5")}Save Score</button><button onclick="clearScoreForm()" class="rounded-xl border border-slate-200 px-5 py-3 font-semibold hover:bg-slate-50">Clear Form</button></div>`;
  updateTotal();
  lucide.createIcons();
}

function updateTotal() {
  let total=0;
  criteria.forEach(c=>{ total += Math.min(Number(document.getElementById("score-"+c.key)?.value)||0,c.max); });
  const totalEl=document.getElementById("live-total");
  if(totalEl) totalEl.innerHTML=`${total}<span class="text-xl text-slate-400"> / 100</span>`;
  const bar=document.getElementById("score-progress");
  if(bar) bar.style.width=total+"%";
}

function clearScoreForm() {
  criteria.forEach(c=>{const el=document.getElementById("score-"+c.key);if(el)el.value="";});
  const comments=document.getElementById("judge-comments");if(comments)comments.value="";
  updateTotal();
}

async async function saveScore() {
  const participantId = document.getElementById("judge-participant")?.value;
  if (!participantId) {
    showToast("Please select a participant.", "error");
    return;
  }

  const values = {};
  let total = 0;

  for (const c of criteria) {
    const el = document.getElementById("score-" + c.key);
    const value = Number(el?.value);
    if (!Number.isFinite(value) || value < 0 || value > c.max) {
      showToast(`Please enter a valid ${c.label} score. Maximum is ${c.max}.`, "error");
      el?.focus();
      return;
    }
    values[c.key] = value;
    total += value;
  }

  const comments = document.getElementById("judge-comments")?.value || "";

  const button = document.querySelector('button[onclick="saveScore()"]');
  if (button) {
    button.disabled = true;
    button.classList.add("opacity-60", "cursor-not-allowed");
  }

  try {
    const params = new URLSearchParams({
      action: "saveScore",
      judgeId: state.currentJudge.id,
      participantId,
      pitch: values.pitch,
      vocalQuality: values.vocalQuality,
      rhythm: values.rhythm,
      expression: values.expression,
      stagePresence: values.stagePresence,
      comments
    });

    const separator = API_URL.includes("?") ? "&" : "?";
    const response = await fetch(API_URL + separator + params.toString(), {
      method: "GET",
      cache: "no-store"
    });

    if (!response.ok) throw new Error("Server returned HTTP " + response.status);

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.message || "Unable to save score.");
    }

    showToast("Score saved to server successfully.", "success");

    await fetchScoresFromServer();

    const select = document.getElementById("judge-participant");
    if (select) {
      select.value = participantId;
      loadParticipant();
    }
  } catch (error) {
    showToast("Score was not saved: " + error.message, "error");
  } finally {
    if (button) {
      button.disabled = false;
      button.classList.remove("opacity-60", "cursor-not-allowed");
    }
  }
}

function scoreTotal(s){return criteria.reduce((sum,c)=>sum+(Number(s[c.key])||0),0);}

function resultsTable(items) {
  return `<div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-slate-50 text-xs uppercase text-slate-500"><tr><th class="px-5 py-3">Rank</th><th class="px-5 py-3">BIB</th><th class="px-5 py-3">Participant</th><th class="px-5 py-3">Total Score</th><th class="px-5 py-3">Status</th></tr></thead><tbody class="divide-y divide-slate-100">${items.map((x,i)=>`<tr><td class="px-5 py-4 font-bold">${i+1}</td><td class="px-5 py-4">${x.bib}</td><td class="px-5 py-4 font-semibold">${x.name}</td><td class="px-5 py-4 text-lg font-bold">${x.score}</td><td class="px-5 py-4">${statusBadge(x.score>0?"completed":"pending")}</td></tr>`).join("")}</tbody></table></div>`;
}

function rankedParticipants() {
  return state.participants.map(p=>{
    const ss=state.scores.filter(s=>s.participantId===p.id);
    const score=ss.length?(ss.reduce((a,s)=>a+scoreTotal(s),0)/ss.length).toFixed(2):"0.00";
    return {...p,score:Number(score)};
  }).sort((a,b)=>b.score-a.score);
}

function startJudging(id) {
  navigate("judging");
  setTimeout(()=>{const select=document.getElementById("judge-participant");if(select){select.value=id;loadParticipant();}},50);

function toggleSidebar(open) {
  const sb=document.getElementById("sidebar"), ov=document.getElementById("overlay");
  if(open){sb.classList.remove("-translate-x-full");ov.classList.remove("hidden");}
  else{sb.classList.add("-translate-x-full");ov.classList.add("hidden");}
}

function showToast(message,type="success") {
  const colors={success:"bg-emerald-600",error:"bg-red-600",info:"bg-slate-900"};
  const el=document.createElement("div");
  el.className=`flex items-center gap-3 rounded-xl ${colors[type]||colors.info} px-4 py-3 text-sm font-medium text-white shadow-xl`;
  el.innerHTML=`${icon(type==="success"?"circle-check":type==="error"?"circle-alert":"info","h-5 w-5")}<span>${message}</span>`;
  document.getElementById("toast-container").appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function login() {
  const pin=document.getElementById("login-pin").value;
  const judge=document.getElementById("login-judge").value.trim();
  if(pin==="1234" && judge){
    state.currentJudge={id:judge,name:"Judge 01"};
    document.getElementById("login-view").classList.add("hidden");
    document.getElementById("app-view").classList.remove("hidden");
    renderNav();renderPage();
    showToast("Login successful.","success");
    fetchParticipantsFromServer().then(() => fetchScoresFromServer());
  } else {
    showToast("Invalid Judge ID or PIN.","error");
  }
}

function logout() {
  document.getElementById("app-view").classList.add("hidden");
  document.getElementById("login-view").classList.remove("hidden");
  showToast("You have been logged out.","info");
}
